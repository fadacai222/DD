name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: dd
          POSTGRES_USER: dd
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dd -d dd"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8.8.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.30.6
        ports:
          - 11025:1025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Go format check
        working-directory: server
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'Go files require gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Go test
        working-directory: server
        run: go test ./...

      - name: Go vet
        working-directory: server
        run: go vet ./...

      - name: Apply database migrations
        working-directory: server
        env:
          DATABASE_URL: postgres://dd:ci-postgres-password@127.0.0.1:5432/dd?sslmode=disable
        run: go run ./cmd/migrate up

      - name: Auth PostgreSQL + Mailpit integration
        working-directory: server
        env:
          DD_AUTH_TEST_DATABASE_URL: postgres://dd:ci-postgres-password@127.0.0.1:5432/dd?sslmode=disable
        run: go test ./internal/auth/account -run TestAccountLifecycleWithPostgresAndMailpit -count=1 -v

      - name: Contacts PostgreSQL concurrency integration
        working-directory: server
        env:
          DD_CONTACTS_TEST_DATABASE_URL: postgres://dd:ci-postgres-password@127.0.0.1:5432/dd?sslmode=disable
        run: go test ./internal/contacts -run TestRelationshipLifecycleWithPostgres -count=1 -v

      - name: Groups PostgreSQL lifecycle and authorization integration
        working-directory: server
        env:
          DD_GROUPS_TEST_DATABASE_URL: postgres://dd:ci-postgres-password@127.0.0.1:5432/dd?sslmode=disable
        run: go test ./internal/groups -run TestGroupLifecycleWithPostgres -count=1 -v

      - name: Calls PostgreSQL lifecycle and multi-device authorization integration
        working-directory: server
        env:
          DD_CALLS_TEST_DATABASE_URL: postgres://dd:ci-postgres-password@127.0.0.1:5432/dd?sslmode=disable
        run: go test ./internal/calls -run TestCallLifecycleWithPostgres -count=1 -v

      - name: Messaging PostgreSQL reliability integration
        working-directory: server
        env:
          DD_MESSAGING_TEST_DATABASE_URL: postgres://dd:ci-postgres-password@127.0.0.1:5432/dd?sslmode=disable
        run: go test ./internal/messaging -run TestMessagingLifecycleWithPostgres -count=1 -v

      - name: Push PostgreSQL lifecycle and worker integration
        working-directory: server
        env:
          DD_PUSH_TEST_DATABASE_URL: postgres://dd:ci-postgres-password@127.0.0.1:5432/dd?sslmode=disable
        run: go test ./internal/push -run TestPushLifecycleWithPostgres -count=1 -v

      - name: Realtime Redis cross-node integration
        working-directory: server
        env:
          DD_REALTIME_TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: go test ./internal/realtimebus -run TestRedisBusCrossNodeDeliveryAndPubSubReconnect -count=1 -v

      - name: OpenAPI strict lint
        run: npx -y @redocly/cli@2.45.0 lint server/openapi/openapi.json --extends=recommended-strict

      - name: Validate development Compose
        env:
          DD_POSTGRES_PASSWORD: 0123456789abcdef0123456789abcdef
          DD_REDIS_PASSWORD: 0123456789abcdef0123456789abcdef
          DD_MINIO_ROOT_PASSWORD: 0123456789abcdef0123456789abcdef
          DD_LIVEKIT_API_KEY: dddev_0123456789abcdef
          DD_LIVEKIT_API_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: docker compose -f infra/dev/compose.yml config --quiet

  admin-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install admin dependencies
        working-directory: admin
        run: npm ci --no-audit --no-fund

      - name: Admin typecheck
        working-directory: admin
        run: npm run typecheck

      - name: Admin production build
        working-directory: admin
        run: npm run build

  flutter-client:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Flutter
        run: |
          git clone --depth 1 --branch 3.44.9 https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Flutter version
        run: flutter --version

      - name: Shared realtime protocol tests
        working-directory: packages/realtime_protocol
        run: |
          dart pub get
          dart test

      - name: Flutter dependencies
        working-directory: clients/app
        run: flutter pub get

      - name: Flutter analyze
        working-directory: clients/app
        run: flutter analyze

      - name: Flutter tests
        working-directory: clients/app
        run: flutter test

      - name: Flutter web release build
        working-directory: clients/app
        run: flutter build web --release

      - name: Flutter Android release build
        working-directory: clients/app
        run: flutter build apk --release

      - name: Upload Web release artifact
        uses: actions/upload-artifact@v4
        with:
          name: dd-web-${{ github.sha }}
          path: clients/app/build/web
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android release artifact
        uses: actions/upload-artifact@v4
        with:
          name: dd-android-${{ github.sha }}
          path: clients/app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

  windows-release:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Flutter
        shell: pwsh
        run: |
          $flutterRoot = Join-Path $env:RUNNER_TEMP 'flutter'
          git clone --depth 1 --branch 3.44.9 https://github.com/flutter/flutter.git $flutterRoot
          (Join-Path $flutterRoot 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Flutter version
        shell: pwsh
        run: flutter --version

      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Flutter dependencies
        working-directory: clients/app
        shell: pwsh
        run: flutter pub get

      - name: Flutter Windows release build
        working-directory: clients/app
        shell: pwsh
        run: flutter build windows --release --no-pub

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: dd-windows-${{ github.sha }}
          path: clients/app/build/windows/x64/runner/Release
          if-no-files-found: error
          retention-days: 7

      - name: Prepare embedded real MP4 smoke fixture
        shell: pwsh
        run: |
          $source = Get-Content -LiteralPath 'clients/app/test/features/messaging/video_media_probe_real_sample_test.dart' -Raw -Encoding UTF8
          $match = [regex]::Match($source, "const _embeddedMp4Base64\s*=\s*'([^']+)';", [System.Text.RegularExpressions.RegexOptions]::Singleline)
          if (-not $match.Success) {
            throw 'Unable to locate embedded MP4 fixture used by the video probe regression test.'
          }
          $fixture = Join-Path $env:RUNNER_TEMP 'dd-video-probe.mp4'
          [System.IO.File]::WriteAllBytes($fixture, [Convert]::FromBase64String($match.Groups[1].Value))
          "DD_VIDEO_SAMPLE_MP4=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows real-engine video probe
        working-directory: clients/app
        shell: pwsh
        run: flutter build windows --release --no-pub --target tool/video_probe_smoke.dart

      - name: Run Windows real-engine video probe
        shell: pwsh
        run: |
          $exe = Resolve-Path 'clients/app/build/windows/x64/runner/Release/im_client.exe'
          $process = Start-Process -FilePath $exe -PassThru
          try {
            if (-not $process.WaitForExit(30000)) {
              throw 'Windows video probe did not exit within 30 seconds.'
            }
            if ($process.ExitCode -ne 0) {
              throw "Windows video probe failed with exit code $($process.ExitCode)."
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }
