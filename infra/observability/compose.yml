services:
  api:
    environment:
      DD_API_OBSERVABILITY_ADDR: ":9464"
    expose:
      - "9464"

  worker:
    environment:
      DD_WORKER_OBSERVABILITY_ADDR: ":9465"
    expose:
      - "9465"

  prometheus:
    image: ${DD_PROMETHEUS_IMAGE:-prom/prometheus:v3.5.0}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${DD_PROMETHEUS_RETENTION:-30d}
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${DD_PROMETHEUS_PORT:-19090}:9090"
    restart: unless-stopped
    networks:
      - internal
      - observability

  blackbox:
    image: ${DD_BLACKBOX_IMAGE:-prom/blackbox-exporter:v0.27.0}
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ../observability/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    expose:
      - "9115"
    restart: unless-stopped
    networks:
      - internal
      - observability

  node-exporter:
    image: ${DD_NODE_EXPORTER_IMAGE:-prom/node-exporter:v1.9.1}
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/.+)($|/)
    pid: host
    volumes:
      - /:/host:ro,rslave
    expose:
      - "9100"
    restart: unless-stopped
    networks:
      - observability

  grafana:
    image: ${DD_GRAFANA_IMAGE:-grafana/grafana:12.1.0}
    environment:
      GF_SECURITY_ADMIN_USER: ${DD_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - grafana-data:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:${DD_GRAFANA_PORT:-13000}:3000"
    restart: unless-stopped
    networks:
      - observability

secrets:
  grafana_admin_password:
    file: ${DD_GRAFANA_ADMIN_PASSWORD_FILE:?DD_GRAFANA_ADMIN_PASSWORD_FILE must point to a local secret file}

networks:
  observability:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
