# yaml-language-server: $schema=https://codemagic.io/codemagic-schema.json

workflows:
  ios-unsigned-validation:
    name: DD iOS unsigned validation
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: clients/app
    environment:
      flutter: "3.44.9"
      xcode: "26.6"
      cocoapods: default
    cache:
      cache_paths:
        - ~/.pub-cache
    scripts:
      - name: Show toolchain versions
        script: |
          flutter --version
          xcodebuild -version
      - name: Resolve Flutter dependencies
        script: flutter pub get
      - name: Analyze Flutter client
        script: dart analyze --fatal-infos
      - name: Run Flutter tests
        script: flutter test
      - name: Install CocoaPods dependencies when present
        script: find ios -name "Podfile" -execdir pod install \;
      - name: Build unsigned iOS Release app
        script: flutter build ios --release --no-codesign
      - name: Validate unsigned Release archive
        script: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/ios/DD-unsigned.xcarchive \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - clients/app/build/ios/iphoneos/*.app
      - clients/app/build/ios/DD-unsigned.xcarchive/**
      - /tmp/xcodebuild_logs/*.log
