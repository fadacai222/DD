org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.overridePathCheck=true
android.newDsl=false
android.builtInKotlin=false
# Release builds use an ASCII subst path to avoid Flutter AOT failures on the
# Chinese project directory. Kotlin incremental caches cannot safely relativize
# plugin sources on C: against that subst drive, so disable only that fragile
# optimization and keep deterministic cross-drive builds.
kotlin.incremental=false
