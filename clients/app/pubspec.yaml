name: im_client
description: Multi-platform client for the self-hosted IM project.
publish_to: none
version: 0.4.0+5

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  crypto: ^3.0.7
  flutter_secure_storage: ^9.2.4
  file_selector: ^1.0.3
  flutter_local_notifications: ^22.2.0
  image: ^4.5.4
  livekit_client: ^2.10.0
  record: ^7.1.1
  audioplayers: ^6.8.1
  realtime_poc:
    path: ../realtime_poc

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
